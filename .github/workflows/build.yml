name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Versão do app: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ runner.os }}-ndk-27.2.12479018

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi
          cargo ndk --version

      - name: Build Rust core for Android
        working-directory: rust
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            --platform 26 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Verify native libraries
        run: |
          set -euo pipefail
          find app/src/main/jniLibs -name "libxiso_core.so" -printf "%p %k KB\n" | sort
          count="$(find app/src/main/jniLibs -name "libxiso_core.so" | wc -l)"
          test "$count" -eq 4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Usando a chave fixa de release configurada nos secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Secrets de assinatura ausentes em pull request. Gerando chave temporária somente para este artifact de PR."
            STORE_PASS="$(openssl rand -base64 32 | tr -d '\n')"
            ALIAS="xiso-pr"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=XISO Tool PR, OU=Build, O=deivid22srk, L=Sao Paulo, ST=SP, C=BR"
          else
            echo "::error::Configure os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD para assinar com a chave fixa."
            exit 1
          fi

          # Falha cedo se o keystore estiver corrompido ou o alias não existir.
          keytool -list -keystore release.keystore -alias "$ALIAS" -storepass "$STORE_PASS" >/dev/null
          keytool -list -v -keystore release.keystore -alias "$ALIAS" -storepass "$STORE_PASS" \
            | grep -E 'Alias name:|Valid from:|SHA256:' || true

          {
            echo "XISO_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore"
            echo "XISO_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "XISO_KEY_ALIAS=$ALIAS"
            echo "XISO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/xiso-tool.apk
          ls -lh dist/

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs dist/xiso-tool.apk
          CERT_SHA256="$("$APKSIGNER" verify --print-certs dist/xiso-tool.apk 2>&1 \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1)"
          test -n "$CERT_SHA256"
          echo "APK_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Certificado do APK: $CERT_SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiso-tool-apk
          path: dist/xiso-tool.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create release notes
        run: |
          set -euo pipefail
          SHA256="$(sha256sum dist/xiso-tool.apk | awk '{print $1}')"
          cat > dist/release-notes.md <<EOF
          APK assinado com a chave fixa de release do XISO Tool.

          - **Versão:** ${VERSION_NAME} (versionCode ${VERSION_CODE})
          - **Commit:** ${GITHUB_SHA}
          - **SHA-256 do APK:** \`${SHA256}\`
          - **Assinatura SHA-256:** \`${APK_CERT_SHA256}\`
          - **ABIs:** arm64-v8a, armeabi-v7a, x86 e x86_64
          - **Build:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Esta release usa a chave fixa de assinatura do projeto. Se você instalou uma versão anterior assinada pela chave temporária de CI, desinstale-a uma vez antes de instalar esta; o Android não permite atualizar entre assinaturas diferentes.

          A ISO criada contém a partição de dados XDVDFS e pode ser usada por emuladores e consoles modificados que aceitam XISO. Ela não recria as partições de vídeo/segurança de um disco XGD completo para gravação em mídia física.
          EOF
          cat dist/release-notes.md

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "XISO Tool ${VERSION_NAME}" \
              --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "XISO Tool ${VERSION_NAME}" \
              --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/xiso-tool.apk --clobber
