name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ runner.os }}-ndk-27.2.12479018

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi
          cargo ndk --version

      - name: Build Rust core for Android
        working-directory: rust
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            --platform 26 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Verify native libraries
        run: |
          set -euo pipefail
          find app/src/main/jniLibs -name "libxiso_core.so" -printf "%p %k KB\n" | sort
          count="$(find app/src/main/jniLibs -name "libxiso_core.so" | wc -l)"
          test "$count" -eq 4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          STORE_PASS="${KEYSTORE_PASSWORD:-xiso-tool-ci-store}"
          ALIAS="${KEY_ALIAS:-xiso}"
          KEY_PASS="${KEY_PASSWORD:-xiso-tool-ci-key}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Usando o keystore configurado nos secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Nenhum keystore configurado. Gerando uma chave temporária para o APK de CI."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=XISO Tool CI, OU=Build, O=deivid22srk, L=Sao Paulo, ST=SP, C=BR"
            # PKCS12 não suporta senha de chave diferente da senha da store.
            KEY_PASS="$STORE_PASS"
          fi

          {
            echo "XISO_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore"
            echo "XISO_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "XISO_KEY_ALIAS=$ALIAS"
            echo "XISO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/xiso-tool.apk
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiso-tool-apk
          path: dist/xiso-tool.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xiso-tool.apk
          generate_release_notes: true
